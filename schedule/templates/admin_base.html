<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Schedule admin{% endblock %} · WHCC</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="site-header"><div class="brand-mark" aria-hidden="true">W</div><div><p class="eyebrow">WHCC small group</p><h1>Schedule admin</h1></div></header>
<main class="admin-page"><nav><a href="{{ url_for('upcoming') }}">View schedule</a>
{% if logged_in %}<a href="{{ url_for('admin_index') }}">Admin home</a><a href="{{ url_for('admin_households') }}">Households and attendance</a><form action="{{ url_for('admin_logout') }}" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="text-button">Sign out</button></form>{% endif %}</nav>
{% block content %}{% endblock %}</main></body></html>
